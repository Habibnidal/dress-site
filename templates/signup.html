{% extends "base_v2.html" %}
{% block head_extra %}
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, rgba(236,72,153,0.25), rgba(139,92,246,0.25)),
                     linear-gradient(135deg, #111827, #0b1220);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }


        /* Page Heading */
        h2 {
            font-size: 32px;
            font-weight: 600;
            color: white;
        }

        button[type="submit"]:active {
            transform: translateY(0);
            
        }

        /* Login Link */
        p {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: white;
            animation: fadeInUp 0.6s ease-out 0.4s both;
        }

        p a {
            color: #ec4899;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
            padding: 2px 4px;
            border-radius: 4px;
        }

        p a:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            text-decoration: underline;
        }

        /* Input Groups */
        .input-group {
            display: flex;
            flex-direction: column;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .form-card {
                padding: 32px 24px;
                margin: 0 16px;
            }

            h2 {
                font-size: 28px;
                margin-bottom: 24px;
            }

            input[type="text"],
            input[type="password"],
            button[type="submit"] {
                padding: 12px 14px;
                font-size: 15px;
            }
        }

        /* Loading State */
        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .loading button[type="submit"] {
            background: #9ca3af;
            cursor: not-allowed;
        }

        /* Form Validation Styles */
        .error {
            border-color: #ef4444 !important;
            background: #fef2f2;
        }

        .error:focus {
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1) !important;
        }

        .success {
            border-color: #10b981 !important;
            background: #f0fdf4;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Focus Ring */
        *:focus-visible {
            outline: 2px solid #ffd700;
            outline-offset: 2px;
        }

        /* Password Strength Indicator */
        .password-strength {
            margin-top: 8px;
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .strength-weak { 
            background: #ef4444; 
            width: 33%; 
        }

        .strength-medium { 
            background: #f59e0b; 
            width: 66%; 
        }

        .strength-strong { 
            background: #10b981; 
            width: 100%; 
        }

        /* Welcome Message */
        .welcome-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            margin-bottom: 16px;
            animation: fadeInDown 0.6s ease-out 0.1s both;
        }
    </style>
{% endblock %}

{% block content %}
    <div class="welcome-text" style="margin-top:3rem;">
        Join our community today
    </div>
    
    <h2>Signup</h2>
    
    <form method="post" class="form-card" id="signupForm">
        <div class="input-group">
            <label for="username">Username</label>
            <input 
                type="text" 
                id="username"
                name="username" 
                required
                autocomplete="username"
                placeholder="Choose a username"
                minlength="3"
            >
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input 
                type="password" 
                id="password"
                name="password" 
                required
                autocomplete="new-password"
                placeholder="Create a secure password"
                minlength="6"
            >
            <div class="password-strength">
                <div class="password-strength-bar" id="strengthBar"></div>
            </div>
        </div>
        <button type="submit" style="width: 100%; padding: 14px 20px; background: linear-gradient(135deg, #ec4899, #8b5cf6); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; margin-top: 8px; ">Sign Up
            </button>

        </div>
{% endblock %}

{% block body_scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('signupForm');
  const inputs = form.querySelectorAll('input');
  const passwordInput = document.getElementById('password');
  const strengthBar = document.getElementById('strengthBar');

  function checkPasswordStrength(password) {
    let strength = 0;
    if (password.length >= 6) strength++;
    if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
    if (/\d/.test(password)) strength++;
    if (/[^a-zA-Z\d]/.test(password)) strength++;
    return strength;
  }

  passwordInput.addEventListener('input', function() {
    const strength = checkPasswordStrength(this.value);
    strengthBar.className = 'password-strength-bar';
    if (this.value.length === 0) {
      strengthBar.style.width = '0%';
    } else if (strength <= 1) {
      strengthBar.classList.add('strength-weak');
    } else if (strength <= 2) {
      strengthBar.classList.add('strength-medium');
    } else {
      strengthBar.classList.add('strength-strong');
    }
  });

  form.addEventListener('submit', function() {
    form.classList.add('loading');
    setTimeout(() => form.classList.remove('loading'), 2000);
  });

  inputs.forEach(input => {
    input.addEventListener('blur', function() {
      if (this.value.trim() === '') { this.classList.add('error'); this.classList.remove('success'); }
      else if (this.checkValidity()) { this.classList.add('success'); this.classList.remove('error'); }
      else { this.classList.add('error'); this.classList.remove('success'); }
    });
    input.addEventListener('input', function() { this.classList.remove('error','success'); });
  });

  const usernameInput = document.getElementById('username');
  usernameInput.addEventListener('input', function() {
    const username = this.value;
    this.value = username.replace(/[^a-zA-Z0-9_-]/g, '');
  });
});
</script>
{% endblock %}
