{% extends "base_v2.html" %}
{% block head_extra %}
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  .login-wrapper { min-height: calc(100vh - 5rem); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .container { width: 100%; max-width: 400px; margin: 0 auto; }
  .form-card { background: #000; border-radius: 16px; padding: 40px 32px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
  .form-card h2 { font-size: 28px; font-weight: 600; color: #fff; text-align: center; margin-bottom: 32px; position: relative; }
  .form-card h2::after { content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); width: 40px; height: 3px; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 2px; }
  form { display: flex; flex-direction: column; gap: 20px; }
  label { font-size: 14px; font-weight: 500; color: #e5e7eb; margin-bottom: 6px; display: block; }
  input[type="text"], input[type="password"] { width: 100%; padding: 12px 16px; border: 2px solid #1f2937; border-radius: 8px; font-size: 16px; background: #0b0f1a; color: #e5e7eb; transition: all 0.2s ease; }
  input[type="text"]:focus, input[type="password"]:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.15); }
  input[type="text"]:hover, input[type="password"]:hover { border-color: #374151; }
  button[type="submit"] { width: 100%; padding: 14px 20px; background: linear-gradient(135deg, #ec4899, #8b5cf6); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; margin-top: 8px; }
  button[type="submit"]:hover { transform: translateY(-1px); box-shadow: 0 10px 20px rgba(102,126,234,0.3); }
  .signup-text { text-align: center; margin-top: 24px; padding-top: 24px; border-top: 1px solid #1f2937; font-size: 14px; color: #9ca3af; }
  .signup-text a { color: #ffd700; text-decoration: none; font-weight: 600; }
  .signup-text a:hover { text-decoration: underline; }
  @media (max-width: 480px) { .form-card { padding: 32px 24px; margin: 0 16px; } .form-card h2 { font-size: 24px; margin-bottom: 24px; } }
</style>
{% endblock %}

{% block content %}
  <div class="login-wrapper">
    <div class="container">
      <div class="form-card">
        <h2>Login</h2>
        <form method="post" id="loginForm">
          <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autocomplete="username" placeholder="Enter your username">
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
          </div>
          <button type="submit">Login</button>
        </form>
        <p class="signup-text">No account? <a href="{{ url_for('signup') }}">Create one here</a></p>
      </div>
    </div>
  </div>
{% endblock %}

{% block body_scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('loginForm');
  const inputs = form.querySelectorAll('input');
  form.addEventListener('submit', function() {
    form.classList.add('loading');
    setTimeout(() => form.classList.remove('loading'), 2000);
  });
  inputs.forEach(input => {
    input.addEventListener('blur', function() {
      if (this.value.trim() === '') { this.classList.add('error'); this.classList.remove('success'); }
      else { this.classList.add('success'); this.classList.remove('error'); }
    });
    input.addEventListener('input', function() { this.classList.remove('error','success'); });
  });
});
</script>
{% endblock %}
